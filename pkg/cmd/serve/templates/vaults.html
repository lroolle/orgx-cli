{{template "head" .}}
<h1>vaults</h1>
<table class="index">
<thead><tr><th>vault</th><th>nodes</th><th class="dim">root</th></tr></thead>
<tbody>
{{range .Rows}}
<tr>
<td><a href="/v/{{esc .Name}}/">{{.Name}}</a></td>

</tr>
{{end}}
</tbody>
</table>
